name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: preci, POSTGRES_PASSWORD: preci, POSTGRES_DB: preciops_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U preci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://preci:preci@localhost:5432/preciops_test
      TEST_DATABASE_URL: postgresql://preci:preci@localhost:5432/preciops_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env: { NEXTAUTH_SECRET: ci-only-secret-not-used-in-production-000, NEXTAUTH_URL: http://localhost:3000, APP_URL: http://localhost:3000 }

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t preciops:ci .
