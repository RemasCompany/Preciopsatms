<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Preciops ATMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F8; --card:#FFFFFF; --ink:#152238; --side:#152238; --side-text:#C9D3E3; --side-hi:#FFFFFF;
  --text:#1A2333; --muted:#5E6A7D; --line:#DCE2EA; --soft:#EBEFF4;
  --teal:#0E7A6E; --teal-soft:#DDF1EE; --amber:#B7790A; --amber-soft:#FBF0D9; --red:#B3261E; --red-soft:#FBE4E2; --blue:#2F5DA8; --blue-soft:#E2EAF7;
  --s0:#8A96A8; --s1:#6C7FA0; --s2:#4D6A9C; --s3:#2F5DA8; --s4:#B7790A; --s5:#0E7A6E; --s6:#B3261E;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1624; --card:#172133; --ink:#E6ECF5; --side:#0A101B; --side-text:#9AA8BE; --side-hi:#FFFFFF;
    --text:#E4E9F1; --muted:#98A5B8; --line:#2A3850; --soft:#1E2A3F;
    --teal:#3CC0AE; --teal-soft:#153B39; --amber:#E5AE45; --amber-soft:#3A2F17; --red:#F07A70; --red-soft:#3D1D1C; --blue:#7FA6E8; --blue-soft:#1C2C4A;
    --s0:#7C889B; --s1:#8196B8; --s2:#7C9AD0; --s3:#7FA6E8; --s4:#E5AE45; --s5:#3CC0AE; --s6:#F07A70;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1624; --card:#172133; --ink:#E6ECF5; --side:#0A101B; --side-text:#9AA8BE; --side-hi:#FFFFFF;
  --text:#E4E9F1; --muted:#98A5B8; --line:#2A3850; --soft:#1E2A3F;
  --teal:#3CC0AE; --teal-soft:#153B39; --amber:#E5AE45; --amber-soft:#3A2F17; --red:#F07A70; --red-soft:#3D1D1C; --blue:#7FA6E8; --blue-soft:#1C2C4A;
  --s0:#7C889B; --s1:#8196B8; --s2:#7C9AD0; --s3:#7FA6E8; --s4:#E5AE45; --s5:#3CC0AE; --s6:#F07A70;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:15px/1.5 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.app{display:grid;grid-template-columns:228px 1fr;min-height:100vh}
.side{align-self:start;background:var(--side);color:var(--side-text);padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:2px}
.brand{color:var(--side-hi);font-weight:800;font-size:19px;letter-spacing:-.02em;padding:0 10px 18px;line-height:1.15}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--side-text);letter-spacing:0;margin-top:3px}
.nav-g{font-size:12px;color:var(--side-text);opacity:.7;padding:14px 10px 4px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;color:var(--side-text);cursor:pointer;font-weight:500}
.nav:hover{background:rgba(255,255,255,.06);color:var(--side-hi)}
.nav[aria-current="page"]{background:rgba(255,255,255,.1);color:var(--side-hi)}
.nav .ct{font-size:12px;opacity:.75;font-variant-numeric:tabular-nums}
.sync{margin-top:auto;font-size:12px;padding:12px 10px 0;opacity:.8}
.sync i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-right:6px;vertical-align:1px}
.sync.on i{background:#3CC0AE}
main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px 28px;border-bottom:1px solid var(--line)}
.search{position:relative;flex:1;max-width:520px}
.search input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px 9px 34px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(10,20,40,.18);max-height:60vh;overflow:auto;display:none}
.results.show{display:block}
.results button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--soft)}
.results button:hover,.results button:focus{background:var(--soft)}
.results .k{font-size:12px;color:var(--muted)}
.view{padding:26px 28px 60px;max-width:1500px;width:100%}
h1{font-size:30px;line-height:1.15;letter-spacing:-.025em;margin:0 0 4px;font-weight:800;color:var(--ink)}
h2{font-size:17px;letter-spacing:-.01em;margin:0 0 12px;font-weight:700}
.lede{color:var(--muted);margin:0 0 22px;max-width:70ch}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.bar .grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
[data-theme="dark"] .btn.pri{color:#07201D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#07201D}}
.btn.ai{background:var(--blue-soft);border-color:transparent;color:var(--blue)}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.inp,select.inp{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:18px}
.kpi{background:var(--card);padding:14px 16px}
.kpi b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink)}
.kpi span{font-size:13px;color:var(--muted)}
.flow{display:flex;gap:4px;align-items:stretch;margin:6px 0 4px}
.flow .st{flex:1;min-width:0}
.flow .fill{height:54px;border-radius:6px;display:flex;align-items:flex-end;padding:6px 8px;color:#fff;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.flow .nm{font-size:12px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flow .cv{font-size:12px;color:var(--muted)}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:720px}
th{font-size:12.5px;font-weight:600;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
td{padding:11px 14px;border-bottom:1px solid var(--soft);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--soft)}
.sub{font-size:13px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.g{background:var(--teal-soft);color:var(--teal)}
.pill.a,.pill.hot{background:var(--amber-soft);color:var(--amber)}
.pill.r{background:var(--red-soft);color:var(--red)}
.pill.b{background:var(--blue-soft);color:var(--blue)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted)}
.track{display:flex;gap:2px;width:96px}
.track i{flex:1;height:6px;border-radius:2px;background:var(--soft)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px}
.col{background:var(--soft);border-radius:12px;padding:10px;min-height:200px;display:flex;flex-direction:column;gap:8px}
.col.over{outline:2px dashed var(--blue);outline-offset:-2px}
.col h3{margin:0 2px 4px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.col h3 small{color:var(--muted);font-weight:500}
.col h3::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--c);margin-right:8px;flex:none}
.col h3 span{display:flex;align-items:center;flex:1}
.cardk{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:9px;padding:9px 10px;cursor:grab;font-size:14px}
.cardk:active{cursor:grabbing}
.cardk b{display:block}
.cardk .meta{display:flex;justify-content:space-between;gap:6px;margin-top:6px;font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--soft)}
.li:last-child{border-bottom:0}
.li .x{min-width:0}
.li .x b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link{background:none;border:0;padding:0;cursor:pointer;text-align:left;width:100%}
.empty{padding:28px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
.scrim{position:fixed;inset:0;background:rgba(8,14,26,.42);z-index:20;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--card);z-index:21;transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.show{transform:none}
.dh{display:flex;align-items:flex-start;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:21px;flex:1;letter-spacing:-.02em}
.db{overflow:auto;padding:18px 22px 40px;flex:1}
.df{display:flex;gap:8px;padding:12px 22px;border-top:1px solid var(--line);flex-wrap:wrap}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.form label.full{grid-column:1/-1}
.form label.chk{flex-direction:row;align-items:center;gap:8px}
.form .inp{color:var(--text);font-size:14.5px}
textarea.inp{min-height:84px;resize:vertical}
.sec{margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
.sec h3{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.aiout{background:var(--soft);border-radius:10px;padding:12px 14px;white-space:pre-wrap;font-size:14px;margin-top:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.score{font-weight:800;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;z-index:40;max-width:90vw;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.warn{color:var(--red);font-weight:600}
.soon{color:var(--amber);font-weight:600}
.okc{color:var(--teal);font-weight:600}
.menu-btn{display:none}
@media (max-width:1100px){.g3{grid-template-columns:1fr 1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:30;transform:translateX(-102%);transition:transform .2s;height:100%;padding-top:calc(22px + env(safe-area-inset-top,0px))}
  .side.show{transform:none}
  .menu-btn{display:inline-flex}
  .top{padding:10px 14px}
  .view{padding:18px 14px 60px}
  .g2,.g3{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  h1{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Main navigation">
    <div class="brand">Preciops ATMS<small>Advanced Talent Management System</small></div>
    <div id="ws" style="display:flex;align-items:center;gap:8px;margin:0 10px 8px;padding:8px 10px;border-radius:9px;background:rgba(255,255,255,.06);font-size:13px;color:var(--side-hi)"></div>
    <div id="navs"></div>
    <div class="sync" id="sync"><i></i>Working offline on this device</div>
  </aside>
  <main>
    <div class="top">
      <button class="btn menu-btn" id="menuBtn" aria-label="Open navigation">☰</button>
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="gs" placeholder="Search candidates, jobs, clients, leads, vendors  ( / )" autocomplete="off" aria-label="Search everything">
        <div class="results" id="gsr" role="listbox"></div>
      </div>
      <div class="grow" style="flex:1"></div>
      <button class="btn pri" data-act="quickAdd">+ New</button>
    </div>
    <div class="view" id="view"></div>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<section class="drawer" id="drawer" aria-modal="true" role="dialog" aria-labelledby="dTitle"></section>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- constants ---------- */
const SECTORS=['IT & Software','Healthcare','Manufacturing','Warehouse','Logistics','Security','Other'];
const TYPES=['Contract','Contract-to-hire','Direct hire','Temp','Per diem'];
const STAGES=['Sourced','Screened','Submitted','Interview','Offer','Placed','Rejected'];
const DEAL_STAGES=['Prospect','Qualified','Proposal','Negotiation','Won','Lost'];
const PROB={Prospect:.1,Qualified:.25,Proposal:.5,Negotiation:.75,Won:1,Lost:0};
const COLS=['jobs','candidates','apps','clients','deals','leads','vendors','tasks','timesheets','esign'];
const HOURS_WK=40;

const F={
 jobs:[['title','Job title','text',null,1],['clientId','Client','ref','clients'],['sector','Sector','sel',SECTORS],['location','Location'],['type','Employment type','sel',TYPES],['openings','Openings','num'],['payRate','Pay rate ($/hr)','num'],['billRate','Bill rate ($/hr)','num'],['status','Status','sel',['Open','On hold','Filled','Closed']],['priority','Priority','sel',['Normal','Hot','Low']],['startDate','Target start','date'],['applyUrl','Apply link (leave blank to apply by email)'],['publish','Show on careers page','chk'],['skills','Required skills (comma separated)','tags'],['description','Description','area']],
 candidates:[['name','Full name','text',null,1],['title','Current title'],['email','Email','email'],['phone','Phone','tel'],['location','Location'],['sector','Sector','sel',SECTORS],['yearsExp','Years of experience','num'],['desiredRate','Desired rate ($/hr)','num'],['availability','Availability','sel',['Immediately','2 weeks','30 days','Passive']],['source','Source','sel',['Job board','Referral','LinkedIn','TempLink USA','Vendor','Walk-in','Website','Other']],['vendorId','Supplied by vendor','ref','vendors'],['status','Status','sel',['Active','On assignment','Placed','Inactive','Do not use']],['skills','Skills (comma separated)','tags'],['certs','Licenses & certifications','tags'],['summary','Summary / resume notes','area']],
 clients:[['name','Company name','text',null,1],['industry','Industry','sel',SECTORS],['status','Status','sel',['Active','Prospect','Inactive']],['city','City / region'],['website','Website'],['markup','Standard markup (%)','num'],['msaDate','MSA signed','date'],['terms','Payment terms','sel',['Net 30','Net 15','Net 45','Net 60']],['contacts','Contacts — one per line: Name, Title, Email, Phone','area'],['notes','Notes','area']],
 deals:[['title','Deal name','text',null,1],['clientId','Client','ref','clients'],['value','Annual value ($)','num'],['stage','Stage','sel',DEAL_STAGES],['closeDate','Expected close','date'],['service','Service line','sel',['Contract staffing','Direct hire','MSP / VMS','Managed IT','Security services','Other']],['notes','Notes','area']],
 leads:[['company','Company','text',null,1],['contact','Contact name'],['role','Contact title'],['email','Email','email'],['phone','Phone','tel'],['industry','Industry','sel',SECTORS],['size','Company size','sel',['1-50','51-200','201-1000','1000+']],['city','City / region'],['source','Source','sel',['Referral','LinkedIn','Cold outreach','Website','Event','RFP / bid','Inbound call','Other']],['status','Status','sel',['New','Contacted','Qualified','Converted','Disqualified']],['score','Score (0–100)','num'],['nextStep','Next follow-up','date'],['notes','Notes','area']],
 vendors:[['name','Vendor name','text',null,1],['category','Category','sel',['Sub-vendor / supplier','Background & drug screening','Job board','Payroll / EOR','Software','Other']],['status','Status','sel',['Pending','Approved','Suspended']],['contact','Contact'],['email','Email','email'],['phone','Phone','tel'],['sectors','Sectors covered','tags'],['feePct','Fee / markup share (%)','num'],['rating','Rating (1–5)','num'],['coiExpires','Insurance (COI) expires','date'],['w9Date','W-9 received','date'],['agreementExpires','Agreement expires','date'],['notes','Notes','area']],
 tasks:[['title','Task','text',null,1],['due','Due date','date'],['priority','Priority','sel',['Normal','High','Low']],['related','Related to'],['done','Done','chk']],
};
const E={
 jobs:{one:'job',title:r=>r.title||'Untitled job'},
 candidates:{one:'candidate',title:r=>r.name||'Unnamed candidate'},
 clients:{one:'client',title:r=>r.name||'Unnamed client'},
 deals:{one:'deal',title:r=>r.title||'Untitled deal'},
 leads:{one:'lead',title:r=>r.company||'Unnamed lead'},
 vendors:{one:'vendor',title:r=>r.name||'Unnamed vendor'},
 tasks:{one:'task',title:r=>r.title||'Task'},
 esign:{one:'document',title:r=>r.title||'Document'},
};

/* ---------- workspace profile (white-label) ---------- */
let PF={company:'The Remas Company, LLC',short:'The Remas Company',owner:'Ernst Remas',ownerTitle:'Founder & CEO',city:'Boca Raton, FL',site:'https://remascompany.com',services:'IT, healthcare, manufacturing, warehouse and logistics',pitch:'Our sister company Eye Tek also covers security officers and remote video monitoring.',logo:''};
const ownerFirst=()=>(PF.owner||'').split(' ')[0]||'there';
/* ---------- utils ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(+n||0)).toLocaleString();
const today=()=>ymd(new Date());
const days=(d)=>d?Math.round((new Date(d+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5):null;
const ago=t=>{if(!t)return'';const s=(Date.now()-t)/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago'};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const arr=c=>Object.values(S[c]);
const clone=o=>JSON.parse(JSON.stringify(o));
const fmtDate=d=>d?new Date(d+'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'—';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2600)}
const nameOf=(c,id)=>{const r=S[c]?.[id];return r?E[c].title(r):''};

/* ---------- store (shared db when available, device storage otherwise) ---------- */
const S={};COLS.forEach(c=>S[c]={});
let ACT_LOG=[];let db=null,sample=null,downloads=null;const LK='remas-talent-os-v1';
function persistLocal(){if(db)return;try{localStorage.setItem(LK,JSON.stringify({S,ACT_LOG,EEO,ARCH,CFG,PF}))}catch(e){}}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LK)||'null');if(d){COLS.forEach(c=>S[c]=d.S?.[c]||{});ACT_LOG=d.ACT_LOG||[];EEO=d.EEO||{};ARCH=d.ARCH||{};if(d.CFG)CFG={...CFG,...d.CFG};if(d.PF)PF={...PF,...d.PF}}}catch(e){}}
function dbErr(e){const c=e?.code;if(c==='quota_exceeded')return'Storage is full. Archive closed records on the Settings & data page to free space.';if(c==='invalid_argument')return'You have view-only access, so changes can\u2019t be saved.';if(c==='resource_exhausted')return'Too many changes at once. Wait a moment and try again.';return'Couldn\u2019t save that change. Check your connection and try again.'}
async function save(col,rec,{silent}={}){

function board(stages,items,stageOf,card,kind){
  return`<div class="board">${stages.map((s,i)=>{const its=items.filter(x=>stageOf(x)===s);return`<div class="col" data-drop="${kind}" data-stage="${s}" style="--c:var(--s${kind==='deal'?[0,2,3,4,5,6][i]:i})"><h3><span>${s}</span><small>${its.length}</small></h3>${its.map(card).join('')||''}</div>`}).join('')}</div>`
}
function bindBoard(){
  document.querySelectorAll('.cardk').forEach(c=>c.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',c.dataset.drag);e.dataTransfer.effectAllowed='move'}));
  document.querySelectorAll('[data-drop]').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('over')});
    col.addEventListener('dragleave',()=>col.classList.remove('over'));
    col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('over');const id=e.dataTransfer.getData('text/plain');if(col.dataset.drop==='app')moveApp(id,col.dataset.stage);else moveDeal(id,col.dataset.stage)});
  });
}
async function moveApp(id,stage,reason){const a=S.apps[id];if(!a||a.stage===stage)return;const c=S.candidates[a.candidateId],j=S.jobs[a.jobId];
  if(stage==='Rejected'&&!reason){pickReason(id);return}
  const upd={...clone(a),stage,stageAt:Date.now(),maxStage:Math.max(maxIdx(a),stage==='Rejected'?0:STAGES.indexOf(stage))};if(reason)upd.reason=reason;await save('apps',upd);
  logAct(`${c?.name||'Candidate'} moved to ${stage} for ${j?.title||'a job'}`);
  if(stage==='Placed'&&c){await save('candidates',{...clone(c),status:'On assignment'});toast(`${c.name} placed. Nice work.`);
    if(j){const placed=appsFor('jobId',j.id).filter(x=>x.stage==='Placed').length;if(placed>=(+j.openings||1)&&j.status==='Open'){await save('jobs',{...clone(j),status:'Filled'});logAct(`${j.title} is fully filled`)}}}
}
async function moveDeal(id,stage){const d=S.deals[id];if(!d||d.stage===stage)return;await save('deals',{...clone(d),stage});logAct(`Deal “${d.title}” moved to ${stage}`);
  if(stage==='Won'){const c=S.clients[d.clientId];if(c&&c.status!=='Active')await save('clients',{...clone(c),status:'Active'});toast('Deal won — client marked active.')}}

function aiErr(e){const c=e?.code;if(c==='not_granted')return'Claude access was declined for this page, so AI features are off for this visit.';if(c==='rate_limited')return'Too many requests. Wait a minute and try again.';if(c==='invalid_json')return'Claude’s reply couldn’t be read. Try again.';if(c==='cancelled')return'Stopped.';return'Claude couldn’t finish that. Try again.'}
function candBrief(c){return{id:c.id,name:c.name,title:c.title,sector:c.sector,skills:(c.skills||[]).slice(0,15),certs:c.certs||[],yearsExp:c.yearsExp,location:c.location,desiredRate:c.desiredRate,availability:c.availability,status:c.status}}
async function withBusy(btn,fn){const t=btn.textContent;btn.disabled=true;btn.textContent='Thinking…';try{await fn()}finally{btn.disabled=false;btn.textContent=t}}
const AI={
 async parseResume(btn){const txt=$('#resumeTxt').value.trim();if(!txt)return toast('Paste resume text first.');
  await withBusy(btn,async()=>{try{const d=await sample.json(`Extract a candidate profile from this resume for a staffing agency ATS. Reply with only a JSON object with keys: name, title (most recent job title), email, phone, location (city, state), sector (exactly one of ${JSON.stringify(SECTORS)}), yearsExp (number), skills (array of up to 15 short skills), certs (array of licenses/certifications), summary (2-3 sentence recruiter summary). Use "" or [] when unknown.\n\nRESUME:\n${txt.slice(0,30000)}`,{modelTier:'quick'});
   const f=$('#recForm');['name','title','email','phone','location','yearsExp','summary'].forEach(k=>{if(d[k]!=null&&d[k]!==''&&f.elements[k])f.elements[k].value=d[k]});if(SECTORS.includes(d.sector))f.elements.sector.value=d.sector;if(Array.isArray(d.skills))f.elements.skills.value=d.skills.join(', ');if(Array.isArray(d.certs))f.elements.certs.value=d.certs.join(', ');
   $('#parseMsg').textContent='Profile filled. Review, then add the candidate.'}catch(e){$('#parseMsg').textContent=aiErr(e)}})},
 async rank(btn){const j=S.jobs[btn.dataset.job];const pool=arr('candidates').filter(c=>!['Do not use','Inactive'].includes(c.status)&&!appsFor('jobId',j.id).some(a=>a.candidateId===c.id)).slice(0,80);
  if(!pool.length)return $('#rankOut').innerHTML='<p class="sub">Every available candidate is already in this pipeline.</p>';
  await withBusy(btn,async()=>{try{const res=await sample.json(`You are a senior staffing recruiter. Rank the best candidates for this job. Weigh required skills, certifications, sector, location, experience, rate fit (desired rate should be at or below pay rate) and availability.\nJOB: ${JSON.stringify({title:j.title,sector:j.sector,location:j.location,type:j.type,payRate:j.payRate,skills:j.skills,description:(j.description||'').slice(0,1500)})}\nCANDIDATES: ${JSON.stringify(pool.map(candBrief))}\nReply with only a JSON array of up to 8 objects {"id":"<candidate id>","score":0-100,"reason":"under 20 words"}, best first. Only include candidates scoring 40 or more.`);
   const rows=(Array.isArray(res)?res:[]).filter(x=>S.candidates[x.id]);ACTX.rank={job:j.id,rows};
   $('#rankOut').innerHTML=`<div class="aiout" style="white-space:normal"><b>Suggested matches</b>${rows.map(x=>`<div class="li"><span class="score" style="color:var(--teal)">${+x.score}</span><div class="x" style="flex:1"><b>${esc(S.candidates[x.id].name)}</b><span class="sub">${esc(x.reason)}</span></div><button class="btn sm" data-act="addMatch" data-cand="${x.id}" data-job="${j.id}" data-score="${+x.score}">Add</button></div>`).join('')||'<p class="sub">No strong matches in your database. Source new candidates for this role.</p>'}</div>`}catch(e){$('#rankOut').innerHTML=`<p class="warn">${aiErr(e)}</p>`}})},
 async jobAd(btn){const j=S.jobs[DR.id];const out=$('#adOut');

function parseCSV(t){const rows=[];let row=[],cur='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'&&t[i+1]==='"'){cur+='"';i++}else if(c==='"')q=false;else cur+=c}else if(c==='"')q=true;else if(c===','||c==='\t'){row.push(cur);cur=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}else cur+=c}row.push(cur);rows.push(row);return rows}

 eeo(){if(!eeoAccess)return`<h1>EEO reporting</h1><div class="panel empty"><b>Restricted</b>Self-identification data and EEO reports are visible only to people with edit access to this page.</div>`;

  const reasons=REASONS.map(r=>[r,apps.filter(a=>a.stage==='Rejected'&&a.reason===r).length]).filter(x=>x[1]);const noReason=apps.filter(a=>a.stage==='Rejected'&&!a.reason).length;

  <div class="kpis"><div class="kpi"><b>${cands.length}</b><span>Applicants</span></div><div class="kpi"><b>${cands.length?Math.round(withId.length/cands.length*100):0}%</b><span>Self-ID response rate</span></div><div class="kpi"><b>${cands.filter(c=>reached(c,5)).length}</b><span>Hired</span></div><div class="kpi"><b class="${noReason?'warn':''}">${noReason}</b><span>Rejections missing a reason</span></div></div>
  <div class="grid">${EEO_F.map(table).join('')}<div class="panel"><h2>Disposition reasons</h2><div class="list">${reasons.map(([r,n])=>`<div class="li"><span>${esc(r)}</span><b>${n}</b></div>`).join('')||'<p class="sub">No rejections recorded.</p>'}</div></div></div>
  <p class="sub" style="margin-top:14px">An impact ratio below 0.80 is a signal to review that step, not a legal finding. This supports the applicant-flow records OFCCP and EEOC expect; it is not an affirmative action plan. Review results with employment counsel.</p>`},

function preciRender(root,jobs,cfg){

  var st={q:'',sector:'',type:'',open:null};

  var opts=function(list,label){return '<option value="">'+label+'</option>'+list.map(function(s){return '<option>'+e(s)+'</option>'}).join('')};
  root.innerHTML='<div class="pc-top"><h2 class="pc-h">'+e(cfg.headline)+'</h2>'+(cfg.intro?'<p class="pc-i">'+e(cfg.intro)+'</p>':'')+'<div class="pc-f"><input class="pc-q" type="search" placeholder="Search by title, skill or city" aria-label="Search jobs">'+(sectors.length>1?'<select class="pc-s" aria-label="Industry">'+opts(sectors,'All industries')+'</select>':'')+(types.length>1?'<select class="pc-ty" aria-label="Job type">'+opts(types,'All job types')+'</select>':'')+'</div><p class="pc-count" aria-live="polite"></p></div><div class="pc-list"></div>';
  function draw(){var q=st.q.toLowerCase();var list=jobs.filter(function(j){return(!st.sector||j.sector===st.sector)&&(!st.type||j.type===st.type)&&(!q||[j.title,j.location,j.sector,j.description].concat(j.skills||[]).join(' ').toLowerCase().indexOf(q)>-1)});
    root.querySelector('.pc-count').textContent=list.length+(list.length===1?' open role':' open roles');
    root.querySelector('.pc-list').innerHTML=list.length?list.map(function(j){var o=st.open===j.id;return '<article class="pc-job"><button class="pc-head" data-id="'+e(j.id)+'" aria-expanded="'+o+'"><span class="pc-t">'+e(j.title)+(j.hot?' <span class="pc-hot">Hiring now</span>':'')+'</span><span class="pc-m">'+[j.location,j.type,j.pay].filter(Boolean).map(e).join(' · ')+'</span></button>'+(o?'<div class="pc-body">'+(j.client?'<span class="pc-m">'+e(j.client)+'</span>':'')+'<p class="pc-d">'+e(j.description).replace(/\n/g,'<br>')+'</p>'+(j.skills&&j.skills.length?'<p class="pc-tags">'+j.skills.map(function(s){return '<span>'+e(s)+'</span>'}).join('')+'</p>':'')+'<a class="pc-apply" href="'+e(applyHref(j))+'" target="_blank" rel="noopener">Apply now</a></div>':'')+'</article>'}).join(''):'<p class="pc-empty">No open roles match right now.'+(cfg.email?' Send your resume to <a href="mailto:'+e(cfg.email)+'">'+e(cfg.email)+'</a> and we\u2019ll reach out when something fits.':'')+'</p>'}
  root.querySelector('.pc-q').addEventListener('input',function(ev){st.q=ev.target.value;draw()});
  var s1=root.querySelector('.pc-s'),s2=root.querySelector('.pc-ty');if(s1)s1.addEventListener('change',function(ev){st.sector=ev.target.value;draw()});if(s2)s2.addEventListener('change',function(ev){st.type=ev.target.value;draw()});
  root.querySelector('.pc-list').addEventListener('click',function(ev){var b=ev.target.closest('.pc-head');if(!b)return;st.open=st.open===b.dataset.id?null:b.dataset.id;draw()});
  if(cfg.ld!==false&&!root.getAttribute('data-ld')){root.setAttribute('data-ld','1');var tm={'Contract':'CONTRACTOR','Contract-to-hire':'CONTRACTOR','Direct hire':'FULL_TIME','Temp':'TEMPORARY','Per diem':'PER_DIEM'};
    jobs.forEach(function(j){var loc=(j.location||'').split(',');var o={'@context':'https://schema.org/','@type':'JobPosting',title:j.title,description:e(j.description||j.title).replace(/\n/g,'<br>'),datePosted:j.posted,employmentType:tm[j.type]||'OTHER',hiringOrganization:{'@type':'Organization',name:cfg.company,sameAs:cfg.site},jobLocation:{'@type':'Place',address:{'@type':'PostalAddress',addressLocality:(loc[0]||'').trim(),addressRegion:(loc[1]||'').trim(),addressCountry:'US'}},identifier:{'@type':'PropertyValue',name:cfg.company,value:j.id},directApply:!!j.applyUrl};if(j.payRate)o.baseSalary={'@type':'MonetaryAmount',currency:'USD',value:{'@type':'QuantitativeValue',value:j.payRate,unitText:'HOUR'}};
      var sc=document.createElement('script');sc.type='application/ld+json';sc.textContent=JSON.stringify(o);document.head.appendChild(sc)})}
  draw();
}

    db.doc('meta/profile').onSnapshot(snap=>{if(snap.exists){PF={...PF,...snap.data()};schedule()}},()=>{});
    db.doc('meta/careers').onSnapshot(snap=>{if(snap.exists){CFG={...CFG,...snap.data()};schedule()}},()=>{});
    db.collection('archive').onSnapshot(snap=>{const o={};snap.docs.forEach(x=>{o[x.id]={...x.data(),id:x.id}});ARCH=o;schedule()},()=>{});
    try{eeoAccess=u?((await u.isOwner())||(await u.canEdit())):false}catch(e){eeoAccess=false}
    if(eeoAccess)db.collection('eeo').onSnapshot(snap=>{const o={};snap.docs.forEach(x=>{o[x.id]=x.data()});EEO=o;schedule()},()=>{});
    db.doc('meta/activity').onSnapshot(snap=>{if(snap.exists){ACT_LOG=(snap.data().items||[]).slice();schedule()}});
  }
  render();
})();
</script>
</body>
</html>
